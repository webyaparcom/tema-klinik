<style>
  /* zaman-film-seridi — Sinema/arşiv metaforu: dönemler film kareleri; görsel arşivi olan markalar için nostaljik dil. */
  .modulex-zaman-film-seridi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-zaman-film-seridi *, .modulex-zaman-film-seridi *::before, .modulex-zaman-film-seridi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-zaman-film-seridi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-zaman-film-seridi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-film-seridi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-zaman-film-seridi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-zaman-film-seridi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-zaman-film-seridi) img { height: auto; }
  .modulex-zaman-film-seridi [hidden] { display: none !important; }
  .modulex-zaman-film-seridi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-zaman-film-seridi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-zaman-film-seridi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-zaman-film-seridi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-zaman-film-seridi--bassiz .modulex-zaman-film-seridi-bas { display: none; }
  .modulex-zaman-film-seridi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-zaman-film-seridi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-film-seridi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-film-seridi-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-zaman-film-seridi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-film-seridi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-film-seridi-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-film-seridi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-zaman-film-seridi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-zaman-film-seridi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-zaman-film-seridi-serit { position: relative; padding-block: 30px; border-radius: 10px; background: color-mix(in srgb, --bg-- 88%, --text--); }
  .modulex-zaman-film-seridi-serit::before, .modulex-zaman-film-seridi-serit::after { content: ""; position: absolute; inset-inline: 12px; height: 14px; background: repeating-linear-gradient(90deg, --bg-- 0 14px, transparent 14px 30px); border-radius: 3px; opacity: 0.9; }
  .modulex-zaman-film-seridi-serit::before { inset-block-start: 8px; }
  .modulex-zaman-film-seridi-serit::after { inset-block-end: 8px; }
  .modulex-zaman-film-seridi-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 300px); gap: 14px; padding-inline: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .modulex-zaman-film-seridi-ray::-webkit-scrollbar { display: none; }
  .modulex-zaman-film-seridi-kare { position: relative; display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-radius: 6px; background: --bg--; scroll-snap-align: start; }
  .modulex-zaman-film-seridi-pencere { display: grid; aspect-ratio: 4 / 3; overflow: hidden; background: color-mix(in srgb, --accent-- 22%, --bg--); }
  .modulex-zaman-film-seridi-gorsel { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.35) contrast(1.05); transition: filter 0.5s ease, transform 0.6s ease; }
  .modulex-zaman-film-seridi-kare:hover .modulex-zaman-film-seridi-gorsel { filter: none; transform: scale(1.04); }
  .modulex-zaman-film-seridi-yer { display: grid; place-items: center; color: --text--; font-size: clamp(2.4rem, 5vw, 3.4rem); font-weight: 900; letter-spacing: -0.04em; }
  .modulex-zaman-film-seridi-alt { display: grid; align-content: start; gap: 6px; padding: 16px; }
  .modulex-zaman-film-seridi-yil { color: --accentInk--; font-weight: 800; }
  .modulex-zaman-film-seridi-kbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-zaman-film-seridi-kmetin { color: --muted--; font-size: 0.9rem; }
  .modulex-zaman-film-seridi-kontrol { display: flex; justify-content: center; gap: 10px; margin-block-start: 18px; }
  .modulex-zaman-film-seridi-ok { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background 0.25s ease, opacity 0.25s ease; }
  .modulex-zaman-film-seridi-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-zaman-film-seridi-ok:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-zaman-film-seridi-ray { grid-auto-columns: 80%; }
  }
  .modulex-zaman-film-seridi-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-film-seridi-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-zaman-film-seridi-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-film-seridi :is(.modulex-zaman-film-seridi-baslik, .modulex-zaman-film-seridi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-film-seridi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-film-seridi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-film-seridi *, .modulex-zaman-film-seridi *::before, .modulex-zaman-film-seridi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-film-seridi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
